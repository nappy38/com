name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # ログ書き戻しコミットでビルドが再帰しないように除外する
    paths-ignore:
      - 'ci/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-log.txt

      # 実行ログのAPIも成果物のAPIも認証を要求するため、失敗時は
      # ログをリポジトリへ書き戻して認証なしで読めるようにする。
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p ci
          tail -c 60000 build-log.txt > ci/last-build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/last-build-log.txt
          git commit -m "CI: 直近のビルドログ [skip ci]"
          git push

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorSafeTrim-debug-apk
          path: app/build/outputs/apk/debug/*.apk
